<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t">
<title id="t">Flow of the Meta4AI observational study: participants, chatbot tasks, post-task items, correction notice, scoring</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<g font-family="Georgia, serif" font-size="14" fill="#000" text-anchor="middle">
<rect x="1" y="36" width="154" height="188" fill="none" stroke="#000" stroke-width="1"/>
<text x="78.0" y="64" font-weight="700" fill="#000">Participants</text>
<line x1="15" x2="141" y1="76" y2="76" stroke="#000" stroke-width="0.75"/>
<text x="78.0" y="102">online panel,</text>
<text x="78.0" y="124">quota by sex</text>
<text x="78.0" y="146">and age</text>
<text x="78.0" y="168">270 completed;</text>
<text x="78.0" y="190">224 valid chat logs</text>
<line x1="158" y1="130.0" x2="183" y2="130.0" stroke="#000" stroke-width="1" marker-end="url(#a)"/>
<rect x="187" y="36" width="154" height="188" fill="none" stroke="#1c2fb0" stroke-width="2"/>
<text x="264.0" y="64" font-weight="700" fill="#1c2fb0">Meta4AI chatbot</text>
<line x1="201" x2="327" y1="76" y2="76" stroke="#1c2fb0" stroke-width="0.75"/>
<text x="264.0" y="102">Claude API</text>
<text x="264.0" y="124">3 tasks: sunscreen,</text>
<text x="264.0" y="146">Palma ratio, column</text>
<text x="264.0" y="168">errors and bias set</text>
<text x="264.0" y="190">in system prompt</text>
<line x1="344" y1="130.0" x2="369" y2="130.0" stroke="#000" stroke-width="1" marker-end="url(#a)"/>
<rect x="373" y="36" width="154" height="188" fill="none" stroke="#000" stroke-width="1"/>
<text x="450.0" y="64" font-weight="700" fill="#000">Post-task items</text>
<line x1="387" x2="513" y1="76" y2="76" stroke="#000" stroke-width="0.75"/>
<text x="450.0" y="102">recall of the content;</text>
<text x="450.0" y="124">other sources used</text>
<line x1="530" y1="130.0" x2="555" y2="130.0" stroke="#000" stroke-width="1" marker-end="url(#a)"/>
<rect x="559" y="36" width="154" height="188" fill="none" stroke="#000" stroke-width="1"/>
<text x="636.0" y="64" font-weight="700" fill="#000">Correction notice</text>
<line x1="573" x2="699" y1="76" y2="76" stroke="#000" stroke-width="0.75"/>
<text x="636.0" y="102">then: did you notice</text>
<text x="636.0" y="124">the error or bias?</text>
<line x1="716" y1="130.0" x2="741" y2="130.0" stroke="#000" stroke-width="1" marker-end="url(#a)"/>
<rect x="745" y="36" width="154" height="188" fill="none" stroke="#000" stroke-width="1"/>
<text x="822.0" y="64" font-weight="700" fill="#000">Scoring</text>
<line x1="759" x2="885" y1="76" y2="76" stroke="#000" stroke-width="0.75"/>
<text x="822.0" y="102">use, evaluation:</text>
<text x="822.0" y="124">from final answers;</text>
<text x="822.0" y="146">communication,</text>
<text x="822.0" y="168">collaboration: coded</text>
<text x="822.0" y="190">from chat logs</text>
</g></svg>